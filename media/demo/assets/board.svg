<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6b3c"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="0.5" stop-color="#b8bec7"/>
      <stop offset="1" stop-color="#d9dde3"/>
    </linearGradient>
    <linearGradient id="usb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f4f6"/>
      <stop offset="0.5" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#d1d5db"/>
    </linearGradient>
    <radialGradient id="hole">
      <stop offset="0.45" stop-color="#2b2b2b"/>
      <stop offset="0.5" stop-color="#d9b45a"/>
      <stop offset="1" stop-color="#b88a2e"/>
    </radialGradient>
  </defs>
  <!-- board -->
  <rect x="10" y="10" width="620" height="380" rx="22" fill="url(#pcb)"/>
  <rect x="10" y="10" width="620" height="380" rx="22" fill="none" stroke="#0f3d22" stroke-width="2"/>
  <!-- traces -->
  <g stroke="#2e8a52" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <path d="M118 200 H190 L215 175 H300"/>
    <path d="M118 220 H200 L222 242 H300"/>
    <path d="M300 300 V330 H470 L495 305 V250"/>
    <path d="M510 160 H560 V120"/>
    <path d="M470 120 V80 H380"/>
    <path d="M150 300 H250 L270 280"/>
    <path d="M555 205 H590"/>
    <path d="M200 120 L230 90 H300"/>
  </g>
  <g fill="#2e8a52" opacity="0.8">
    <circle cx="300" cy="175" r="6"/><circle cx="300" cy="242" r="6"/>
    <circle cx="560" cy="120" r="6"/><circle cx="380" cy="80" r="6"/>
    <circle cx="270" cy="280" r="6"/><circle cx="300" cy="90" r="6"/>
  </g>
  <!-- mounting holes -->
  <g fill="url(#hole)">
    <circle cx="44" cy="44" r="15"/><circle cx="596" cy="44" r="15"/>
    <circle cx="44" cy="356" r="15"/><circle cx="596" cy="356" r="15"/>
  </g>
  <!-- USB-C on the left edge -->
  <rect x="2" y="180" width="70" height="44" rx="12" fill="url(#usb)" stroke="#6b7280" stroke-width="2"/>
  <rect x="12" y="194" width="50" height="16" rx="8" fill="#374151"/>
  <!-- RF module with shield can -->
  <rect x="300" y="50" width="200" height="150" rx="6" fill="#111827"/>
  <rect x="312" y="62" width="176" height="126" rx="4" fill="url(#can)" stroke="#9ca3af" stroke-width="2"/>
  <text x="400" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#6b7280">RF-MOD</text>
  <text x="400" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b929c">2.4 GHz</text>
  <!-- MCU -->
  <rect x="190" y="230" width="80" height="80" rx="4" fill="#1f1f1f"/>
  <circle cx="202" cy="242" r="4" fill="#3a3a3a"/>
  <text x="230" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">MCU</text>
  <!-- regulator -->
  <rect x="120" y="100" width="44" height="30" rx="3" fill="#1f1f1f"/>
  <g fill="#c0c4ca"><rect x="124" y="92" width="8" height="8"/><rect x="138" y="92" width="8" height="8"/><rect x="152" y="92" width="8" height="8"/><rect x="132" y="130" width="20" height="9"/></g>
  <!-- passives -->
  <g>
    <g fill="#b9a27a"><rect x="120" y="150" width="22" height="12" rx="2"/><rect x="150" y="150" width="22" height="12" rx="2"/><rect x="300" y="222" width="22" height="12" rx="2"/><rect x="520" y="230" width="22" height="12" rx="2"/></g>
    <g fill="#222"><rect x="300" y="250" width="22" height="12" rx="2"/><rect x="330" y="250" width="22" height="12" rx="2"/><rect x="520" y="255" width="22" height="12" rx="2"/><rect x="120" y="300" width="22" height="12" rx="2"/></g>
    <g fill="#d4d8de"><rect x="120" y="150" width="4" height="12"/><rect x="138" y="150" width="4" height="12"/><rect x="150" y="150" width="4" height="12"/><rect x="168" y="150" width="4" height="12"/><rect x="300" y="250" width="4" height="12"/><rect x="318" y="250" width="4" height="12"/><rect x="330" y="250" width="4" height="12"/><rect x="348" y="250" width="4" height="12"/><rect x="520" y="255" width="4" height="12"/><rect x="538" y="255" width="4" height="12"/></g>
    <!-- button -->
    <rect x="380" y="235" width="56" height="56" rx="4" fill="#d1d5db"/>
    <circle cx="408" cy="263" r="16" fill="#1f2937"/>
  </g>
  <!-- status LED -->
  <rect id="led" x="539" y="196" width="28" height="18" rx="3" fill="#e8efe8" stroke="#c8d0c8" stroke-width="1.5"/>
  <rect x="539" y="196" width="5" height="18" fill="#c7ccd2"/><rect x="562" y="196" width="5" height="18" fill="#c7ccd2"/>
  <!-- header pins -->
  <rect x="150" y="345" width="330" height="30" rx="3" fill="#141414"/>
  <g fill="#d6b25b">
    <rect x="160" y="353" width="14" height="14"/><rect x="190" y="353" width="14" height="14"/><rect x="220" y="353" width="14" height="14"/><rect x="250" y="353" width="14" height="14"/><rect x="280" y="353" width="14" height="14"/><rect x="310" y="353" width="14" height="14"/><rect x="340" y="353" width="14" height="14"/><rect x="370" y="353" width="14" height="14"/><rect x="400" y="353" width="14" height="14"/><rect x="430" y="353" width="14" height="14"/><rect x="456" y="353" width="14" height="14"/>
  </g>
  <!-- silkscreen -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#f2f2f2" font-weight="700">
    <text x="553" y="186" text-anchor="middle" font-size="14">STAT</text>
    <text x="408" y="312" text-anchor="middle" font-size="12">RST</text>
    <text x="150" y="88" font-size="12">3V3</text>
    <text x="160" y="338" font-size="11">GND</text><text x="446" y="338" font-size="11">VIN</text>
    <text x="510" y="372" font-size="15">SENSOR NODE v2</text>
  </g>
  <rect x="535" y="192" width="36" height="26" rx="3" fill="none" stroke="#f2f2f2" stroke-width="1.5"/>
</svg>
