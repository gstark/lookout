      const tl = gsap.timeline({ paused: true });

      // Terminal blocks appear in turn.
      const times = { "pr-p1": 3.7, "pr-p2": 9.0, "pr-p3": 10.3, "pr-p4": 12.4, "pr-p5": 12.9, "pr-p6": 14.3, "pr-p7": 15.6, "pr-p8": 16.3, "pr-p9": 20.5 };

        const el = document.getElementById(id);
        el.style.height = el.dataset.h + "px";
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, t);
      });
      const type = (id, t, duration) => {
        const el = document.getElementById(id);
        const text = el.textContent;
        el.textContent = "";
        const typed = { n: 0 };
        tl.fromTo(typed, { n: 0 }, { n: text.length, duration, ease: "none", onUpdate: () => { el.textContent = text.slice(0, Math.round(typed.n)); } }, t);
      };
      const tap = (id, t) => {
        tl.fromTo(id, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15 }, t);
        tl.to(id, { opacity: 0, scale: 1.3, duration: 0.3 }, t + 0.2);
      };

      // 1. The phone joins the tailnet.
      tap("#pr-tap-ts", 5.0);
      tl.fromTo("#pr-thumb", { x: 0 }, { x: 24, duration: 0.2, ease: "power2.out" }, 5.2);

      tl.fromTo("#pr-ts-key", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.4);
      tl.fromTo("#pr-ts-ip", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 5.6);
      tl.fromTo("#pr-ts-peers", { opacity: 0.35 }, { opacity: 1, duration: 0.3 }, 5.7);
      tl.fromTo("#pr-ts", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 6.9);

      type("pr-p1-text", 7.3, 1.4);
      tl.fromTo("#pr-p2-a", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 9.0);
      tl.fromTo("#pr-p2-b", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 9.4);

      // 3. The agent finds the phone and asks to pair.
      type("pr-p3-text", 10.4, 1.6);
      tl.fromTo("#pr-p5-res", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 13.5);
      tl.fromTo("#pr-p6-res", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 14.9);
      tl.fromTo("#pr-ask", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 15.0);
      const left = { s: 120 };
      const leftEl = document.getElementById("pr-ask-left");
      tl.fromTo(left, { s: 120 }, { s: 115, duration: 4.85, ease: "none", onUpdate: () => { leftEl.textContent = Math.ceil(left.s); } }, 15.0);
      tl.fromTo("#pr-p8-res", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 16.3);
      tl.fromTo("#pr-p8-wait", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 16.6);

      // 4. The person checks the code in both places, then taps Allow.
      tl.fromTo("#pr-ring-a, #pr-ring-b", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, 17.0);
      tl.fromTo("#pr-link-path", { strokeDashoffset: 1300, opacity: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 17.3);
      tl.fromTo("#pr-link-path2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 18.0);
