        grid.appendChild(s);
      }

      const tl = gsap.timeline({ paused: true });
      const END = 39;

      // The STAT LED blinks 3 long, 2 short, every 5 s, for the whole film.
      const ON = [[0, 0.6], [0.9, 1.5], [1.8, 2.4], [3.2, 3.35], [3.65, 3.8]];

        ON.forEach(([a, b], i) => {
          if (!(k === 0 && i === 0)) tl.set(".glow.live", { opacity: 1 }, k * 5 + a);
          tl.set(".glow.live", { opacity: 0 }, k * 5 + b);
        });
      }

      // The desk scene covers 0-3.95 s and hands over the terminal; the phone UI then slides in.
      tl.fromTo("#term", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 3.3);
      tl.fromTo("#phone-wrap", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, 4.05);

      // The board starts at the right edge, half out of frame.
      tl.fromTo(".board.live", { xPercent: 107.7, yPercent: -34.7, rotation: 4 }, { xPercent: 107.7, yPercent: -34.7, rotation: 4, duration: 0.01 }, 0);

      // Terminal blocks appear in turn; the view scrolls when the text reaches the bottom.
      const VIEW = 784;
      const times = { b1: 3.7, b2: 6.6, b3: 7.1, b4: 8.9, b5: 9.8, b6: 15.4, b7: 16.5, b8: 17.3, b9: 24.2, b10: 26.6, b11: 28.6, b12: 32.7 };
      let total = 0;
      Object.entries(times).forEach(([id, t]) => {
        const el = document.getElementById(id);
        const h = Number(el.dataset.h);
        el.style.height = h + "px";
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, t);
        total += h;
        if (total > VIEW) tl.to("#term-scroll", { y: VIEW - total, duration: 0.5, ease: "power2.inOut" }, t - 0.1);
      });

      // The person types the question.
      const b1 = document.getElementById("b1-text");
      const q = b1.textContent;
      b1.textContent = "";
      const typed = { n: 0 };
      tl.fromTo(typed, { n: 0 }, { n: q.length, duration: 2.4, ease: "none", onUpdate: () => { b1.textContent = q.slice(0, Math.round(typed.n)); } }, 3.9);

      // A served frame flashes the preview border red.
      const flash = (t) => tl.fromTo("#flash", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power1.out", immediateRender: false }, t);

      // look
      flash(7.45);
      tl.fromTo("#b3-res", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.8);

      // capture with a guide: the layout switches, the person slides the board, then taps Ready.
      tl.fromTo("#b5-res", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 9.8);
      tl.fromTo("#b5-wait", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 10.2);
      tl.fromTo("#layout-main", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 10.3);
      tl.fromTo("#layout-guide", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 10.3);
      const left = { s: 120 };
      const leftEl = document.getElementById("guide-left");
      tl.fromTo(left, { s: 120 }, { s: 116, duration: 3.6, ease: "none", onUpdate: () => { leftEl.textContent = Math.ceil(left.s); } }, 10.3);
      tl.to(".board.live", { xPercent: 70, yPercent: -20, rotation: 2.5, duration: 0.7, ease: "power2.out" }, 11.2);
      tl.to(".board.live", { xPercent: 22, yPercent: -4, rotation: -1, duration: 0.8, ease: "power2.inOut" }, 11.9);
      tl.to(".board.live", { xPercent: 0, yPercent: 0, rotation: 0, duration: 0.5, ease: "power2.out" }, 12.75);
      tl.fromTo("#tap-ready", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15 }, 13.75);
      tl.to("#tap-ready", { opacity: 0, scale: 1.3, duration: 0.3 }, 13.95);
      tl.to("#layout-guide", { opacity: 0, duration: 0.2 }, 14.0);
      tl.to("#layout-main", { opacity: 1, duration: 0.2 }, 14.0);
      flash(14.15);
      tl.to("#b5-wait", { opacity: 0, duration: 0.2 }, 14.5);
      tl.to("#b5-res", { opacity: 1, duration: 0.3 }, 14.6);

      // roi
      tl.fromTo("#roi-box", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 15.8);
      tl.fromTo("#roi-card", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 15.8);
      tl.fromTo("#feed", { y: 0 }, { y: 148, duration: 0.35, ease: "power2.out" }, 15.8);

      // record: six seconds at 60 fps, then the phone analyzes the clip.
      tl.fromTo("#recpanel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 17.0);
      const rec = { ms: 6000 };
      const recEl = document.getElementById("rec-count");
      tl.fromTo(rec, { ms: 6000 }, { ms: 0, duration: 6, ease: "none", onUpdate: () => {
        const v = Math.max(0, rec.ms);
        recEl.textContent = "0:0" + Math.floor(v / 1000) + "." + Math.floor((v % 1000) / 100);
      } }, 17.0);
      tl.fromTo("#rec-bar", { scaleX: 1 }, { scaleX: 0, duration: 6, ease: "none" }, 17.0);
      // The same red line runs around the preview and gets shorter at the same rate.
      tl.fromTo("#rec-ring", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 17.0);
      tl.fromTo("#rec-ring-line", { strokeDashoffset: 0 }, { strokeDashoffset: 1294, duration: 6, ease: "none" }, 17.0);
      tl.set("#rec-ring", { opacity: 0 }, 23.0);
      for (let t = 17.0; t < 23; t += 1.2) {
        tl.to("#rec-dot", { opacity: 0.2, duration: 0.6, ease: "sine.inOut" }, t);
        tl.to("#rec-dot", { opacity: 1, duration: 0.6, ease: "sine.inOut" }, t + 0.6);
      }
      tl.to("#rec-top", { opacity: 0, duration: 0.15 }, 23.0);
      tl.fromTo("#rec-analyze", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 23.0);
      tl.to("#recpanel", { opacity: 0, y: 20, duration: 0.3 }, 23.6);
      tl.fromTo("#b8-res", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 17.3);
      tl.to("#b8-wait", { opacity: 0, duration: 0.2 }, 23.6);
      tl.to("#b8-res", { opacity: 1, duration: 0.3 }, 23.7);

      // clip trace: the brightness line draws left to right.
      tl.fromTo("#demo-trace", { strokeDashoffset: 2400 }, { strokeDashoffset: 0, duration: 1.4, ease: "power1.inOut" }, 24.5);

      // ask on the phone; the person taps No, battery.
      tl.fromTo("#b11-res", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 28.6);
      tl.fromTo("#ask", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 29.0);
      const ask = { s: 60 };
      const askEl = document.getElementById("ask-left");
      tl.fromTo(ask, { s: 60 }, { s: 58, duration: 2.4, ease: "none", onUpdate: () => { askEl.textContent = Math.ceil(ask.s); } }, 29.0);
      tl.fromTo("#tap-no", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15 }, 31.5);
      tl.to("#tap-no", { opacity: 0, scale: 1.3, duration: 0.3 }, 31.7);
      tl.to("#ask", { opacity: 0, duration: 0.25 }, 31.8);
      tl.to("#b11-res", { opacity: 1, duration: 0.3 }, 32.0);

      // Activity feed: newest row on top, older rows move down.
      const rows = Array.from(document.querySelectorAll(".frow"));
      const ts = rows.map((r) => Number(r.dataset.t));
      rows.forEach((r, i) => {
        tl.fromTo(r, { opacity: 0 }, { opacity: 1, duration: 0.25 }, ts[i]);
        for (let k = i + 1; k < rows.length; k++) {
          tl.fromTo(r, { y: (k - 1 - i) * 17 }, { y: (k - i) * 17, duration: 0.25, ease: "power2.out", immediateRender: false }, ts[k]);
        }
      });

      // Blur out into the desk scene that shows the fix.
      tl.to("#term, #phone-wrap", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power1.in" }, END - 0.25);
      tl.to({}, { duration: 0.01 }, END - 0.01);
      window.__timelines["demo"] = tl;
    })();
  </script>
</template>
